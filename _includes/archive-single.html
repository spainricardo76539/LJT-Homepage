{% include base_path %}

<div class="{{ include.type | default: 'list' }}__item">
  <article class="archive__item" itemscope itemtype="http://schema.org/CreativeWork">
    <h2 class="archive__item-title" itemprop="headline">
      <a href="{{ base_path }}{{ post.url }}" rel="permalink">{{ post.title }}</a>
    </h2>
    {% if post.collection == 'publications' %}
      <p>Published in <i>{{ post.venue }}</i>, {{ post.year }}</p>
    {% elsif post.date %}
      <p class="page__date"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %d, %Y' }}</time></p>
    {% endif %}
    {% if post.excerpt %}
      <div class="archive__item-excerpt" itemprop="description">{{ post.excerpt | markdownify }}</div>
    {% endif %}
  </article>
</div>
